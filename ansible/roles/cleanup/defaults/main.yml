---
# Verified via `apt-get -s purge <list>` against the live box (2026-08-27) — nothing else
# installed depends on any of these, so removal is a clean, isolated purge with no side effects.
# Each one:
#   - reportbug / python3-reportbug: Debian's interactive bug-reporting tool. Needs a local MTA to
#     actually send anything — this box doesn't have one (exim4 was purged the same day for the
#     same reason: an unused local mailer, see README), so reportbug was already nonfunctional as
#     installed. Pure dead weight.
#   - discover / discover-data / libdiscover2: hardware auto-detection tooling, relevant at
#     install time, not at runtime on fixed, already-known hardware.
#   - wamerican: American English word list (dictionary/spell-check data) — unused on a headless
#     box with no spell-checking tools installed.
#   - doc-debian / debian-faq: pure documentation packages, zero functional value on this box.
#   - inetutils-telnet: unencrypted legacy telnet *client* (no server, so not a listening-service
#     risk either way) — no reason to keep an unencrypted protocol client installed.
#   - exim4-base / exim4-config / exim4-daemon-light / bsd-mailx / gpg-wks-server: a real listening
#     network daemon (127.0.0.1:25/[::1]:25) that appeared as a side effect of the bookworm->trixie
#     upgrade (pulled in as Recommends of gnupg's gpg-wks-server / reportbug), not something
#     intentionally installed. This box's monitoring already goes through ntfy.sh, not local mail —
#     removed 2026-08-27 after confirming (`apt-get -s remove`) nothing else depends on it.
#
# Deliberately NOT included (considered, rejected):
#   - netcat-traditional, pciutils: legitimate diagnostic tools, low footprint, plausible future
#     use troubleshooting this exact box over serial console.
#   - tasksel / tasksel-data / task-ssh-server: task-ssh-server is what originally pulled in
#     openssh-server — untangling that risks touching SSH itself for no real benefit, not worth it.
#   - X11 client libraries (libx11-6, xauth, etc.): pulled in as Recommends of openssh-client (X11
#     forwarding support), not directly installed — removing them would just have apt reinstall
#     them on the next run unless `APT::Install-Recommends` were disabled globally, which is a
#     bigger, unrelated behavior change not worth bundling into a package-cleanup role.
cleanup_purge_packages:
  - reportbug
  - python3-reportbug
  - discover
  - discover-data
  - libdiscover2
  - wamerican
  - doc-debian
  - debian-faq
  - inetutils-telnet
  - exim4-base
  - exim4-config
  - exim4-daemon-light
  - bsd-mailx
  - gpg-wks-server
