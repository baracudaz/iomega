---
- name: Cap journald disk usage (20GB root partition — don't let logs eat it)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: "SystemMaxUse={{ tuning_journald_max_use }}"
  notify: Restart journald

- name: Tune vm.swappiness for HDD-backed swap on a 234MB-RAM box
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ tuning_vm_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-iomega.conf
    state: present
    reload: true

- name: Guarantee a baseline RAID resync rate (don't let it starve under load)
  ansible.posix.sysctl:
    name: dev.raid.speed_limit_min
    value: "{{ tuning_raid_resync_min_kbps }}"
    sysctl_file: /etc/sysctl.d/99-iomega.conf
    state: present
    reload: true

- name: Check whether lm-sensors has already been configured
  ansible.builtin.stat:
    path: /etc/sensors.d/.ansible-detected
  register: tuning_sensors_detected

- name: Run sensors-detect non-interactively (fixes fan-tach mislabeling on this board)
  ansible.builtin.shell: set -o pipefail && yes "" | sensors-detect --auto
  args:
    executable: /bin/bash
  when: not tuning_sensors_detected.stat.exists
  changed_when: true

- name: Mark sensors-detect as done
  ansible.builtin.file:
    path: /etc/sensors.d/.ansible-detected
    state: touch
    mode: '0644'
  when: not tuning_sensors_detected.stat.exists
