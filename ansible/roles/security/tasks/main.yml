---
- name: Install security-related packages
  ansible.builtin.apt:
    name:
      - sudo
      - ufw
      # unattended-upgrades removed 2026-09-13 — its background apt runs were
      # visibly hogging CPU on this box's single weak ARMv5 core, competing
      # with actual work (observed during the srv/data migration in
      # docs/boot.md). Manual `apt upgrade` is used instead.
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure admin user is in the sudo group
  ansible.builtin.user:
    name: "{{ security_admin_user }}"
    groups: sudo
    append: true

- name: Grant passwordless sudo to admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ security_admin_user }}-nopasswd"
    mode: '0440'
    content: "{{ security_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: 'visudo -cf %s'
  when: security_passwordless_sudo

- name: Pin explicit SSH root-login policy (no password login for root, key-only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
  notify: Restart sshd

- name: Disable SSH password authentication (key-only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: Restart sshd

- name: Check ufw status
  ansible.builtin.command: ufw status
  register: security_ufw_status
  changed_when: false

- name: Allow OpenSSH through ufw
  ansible.builtin.command: ufw allow OpenSSH
  register: security_ufw_allow
  changed_when: "'Skipping' not in security_ufw_allow.stdout"

- name: Enable ufw (default deny incoming)
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in security_ufw_status.stdout"
  changed_when: true

# Upgraded bookworm -> trixie on 2026-08-27. trixie-security carries a native
# armel Packages index (confirmed live against
# https://security.debian.org/debian-security/dists/trixie-security/Release,
# which lists armel alongside amd64/arm64/armhf/i386/ppc64el/riscv64/s390x) —
# unlike bookworm once it aged into oldstable, trixie is current stable, so
# there's no missing-index problem here and no arch= restriction is needed.
# NOTE: trixie is upstream's last release to support armel at all (this SoC has
# no hardware FPU, so armhf/arm64 aren't an option for this hardware) — there
# is no further "just re-run this same fix" path after this release.

# unattended-upgrades disabled 2026-09-13 (see the package-install task above for why) —
# these two tasks used to configure and enable it. Left here, commented out, as the
# quickest way to re-enable it later if wanted:
#
# - name: Configure unattended-upgrades origins
#   ansible.builtin.copy:
#     dest: /etc/apt/apt.conf.d/50unattended-upgrades-local
#     mode: '0644'
#     content: |
#       // Plain codename-based origins — trixie-security has a normal, complete
#       // armel package index (see roles/security/tasks/main.yml), unlike
#       // bookworm-security once bookworm aged into oldstable.
#       Unattended-Upgrade::Origins-Pattern {
#               "origin=Debian,codename=${distro_codename}-security";
#               "origin=Debian,codename=${distro_codename}-updates";
#       };
#       Unattended-Upgrade::Remove-Unused-Dependencies "true";
#
# - name: Enable periodic apt update/upgrade timers
#   ansible.builtin.copy:
#     dest: /etc/apt/apt.conf.d/20auto-upgrades
#     mode: '0644'
#     content: |
#       APT::Periodic::Update-Package-Lists "1";
#       APT::Periodic::Unattended-Upgrade "1";

- name: Ensure unattended-upgrades package is removed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true

- name: Remove leftover unattended-upgrades apt config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/50unattended-upgrades-local
    - /etc/apt/apt.conf.d/20auto-upgrades
