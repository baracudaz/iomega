---
# Self-built from official tailscale/tailscale source, not an apt package — no
# armel/ARMv5 build exists upstream (https://github.com/tailscale/tailscale/issues/676).
# Built via https://github.com/baracudaz/tailscale-builds (a fork of
# prashantv/tailscale-builds, GOOS=linux GOARCH=arm GOARM=5), which also auto-builds
# new upstream stable releases daily. Bumping tailscale_version requires also updating
# the two checksums below — get them with, e.g.:
#   curl -sL https://github.com/baracudaz/tailscale-builds/releases/download/<version>/tailscale-linux-armv5 | shasum -a256
tailscale_version: v1.102.4
tailscale_release_repo: baracudaz/tailscale-builds
# Same ts_omit_* feature-tag trimming as the v1.102.3 rebuild (see
# github.com/baracudaz/tailscale-builds .github/workflows/build.yaml) — the fork's daily
# build workflow carries the trimming forward automatically for each new upstream release.
tailscale_cli_sha256: 5bcbf1d135393174f68b1a57bab1542d3ea5c467a1ca5dd68052d0f1786beb77
tailscaled_sha256: 703bb6de7bfb50c44c5cd963fad1ff773d3b6bf0fa000d81c404f702785fbc92

tailscale_port: 41641

# Tried GOGC/GOMEMLIMIT/GODEBUG=madvdontneed tuning for the 256MB-RAM box (see
# ansible/roles/tuning) but none of it moved steady-state RSS once isolated from
# measurement noise — GOMEMLIMIT actively made it worse (35MB vs 25MB baseline; it's a
# target the GC pacer grows into, not a ceiling). The real win was trimming unused
# features out of the binary itself via ts_omit_* build tags — see
# github.com/baracudaz/tailscale-builds .github/workflows/build.yaml — which settled
# at ~24MB with no runtime env vars at all.
