---
# All three are matthart1983's sibling single-host diagnostics/network tools. Each
# release is a single-file tarball (no upstream checksums published, so the tarball
# itself is checksum-verified via get_url before extracting) -- downloaded and
# extracted to a scratch dir, then the binary is moved into place and the scratch
# dir cleaned up.

- name: Install diskwatch
  block:
    - name: Download diskwatch release tarball
      ansible.builtin.get_url:
        url: "https://github.com/matthart1983/diskwatch/releases/download/{{ diskwatch_version }}/diskwatch-linux-armv5te.tar.gz"
        dest: /tmp/diskwatch.tar.gz
        checksum: "sha256:{{ diskwatch_tarball_sha256 }}"
        mode: '0644'

    - name: Extract diskwatch tarball
      ansible.builtin.unarchive:
        src: /tmp/diskwatch.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install diskwatch binary
      ansible.builtin.copy:
        src: /tmp/diskwatch-linux-armv5te
        dest: /usr/local/bin/diskwatch
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Clean up diskwatch scratch files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/diskwatch.tar.gz
        - /tmp/diskwatch-linux-armv5te

