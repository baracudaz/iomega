---
# Skips fsync() on dpkg's individual file writes, which is the actual CPU/IO-bound part
# of every apt install/remove/upgrade on this box's weak single-core ARMv5 CPU — a real,
# noticeable speedup. Trade-off: if power is lost mid-dpkg-operation, the package database
# can end up corrupted (recoverable, but annoying) — accepted here since this device isn't
# doing unattended/overnight package operations (unattended-upgrades was removed for
# unrelated CPU-hogging reasons — see the security role).
- name: Speed up dpkg by skipping fsync on package installs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-unsafe-io
    mode: '0644'
    content: |
      DPkg::Options:: "--force-unsafe-io";

- name: Install base utility packages
  ansible.builtin.apt:
    name:
      - rsync
      - smartmontools
      - lm-sensors
      - gnupg
      - sysstat
      # testdisk's Debian package also provides `photorec` (same binary tree, one apt
      # package) — no separate package needed.
      - testdisk
      # tmux: lets photorec's ncurses TUI be driven and monitored non-interactively over SSH
      # (a detached session survives disconnects, and `tmux capture-pane -e` preserves the
      # ANSI highlight codes needed to see which menu item is actually selected).
      - tmux
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set hostname
  ansible.builtin.hostname:
    name: iomega

- name: Ensure /etc/hosts has matching hostname entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\tiomega"
