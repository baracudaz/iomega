---
# Skips fsync() on dpkg's individual file writes, which is the actual CPU/IO-bound part
# of every apt install/remove/upgrade on this box's weak single-core ARMv5 CPU — a real,
# noticeable speedup. Trade-off: if power is lost mid-dpkg-operation, the package database
# can end up corrupted (recoverable, but annoying) — accepted here since this device isn't
# doing unattended/overnight package operations (unattended-upgrades was removed for
# unrelated CPU-hogging reasons — see the security role).
- name: Speed up dpkg by skipping fsync on package installs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-unsafe-io
    mode: '0644'
    content: |
      DPkg::Options:: "--force-unsafe-io";

- name: Install base utility packages
  ansible.builtin.apt:
    name:
      - rsync
      - smartmontools
      - lm-sensors
      - gnupg
      - sysstat
      # testdisk's Debian package also provides `photorec` (same binary tree, one apt
      # package) — no separate package needed.
      - testdisk
      # tmux: lets photorec's ncurses TUI be driven and monitored non-interactively over SSH
      # (a detached session survives disconnects, and `tmux capture-pane -e` preserves the
      # ANSI highlight codes needed to see which menu item is actually selected).
      - tmux
      # Manually installed 2026-09-13/14 for interactive diagnostics; tracked here so it
      # survives a reprovision instead of being an undocumented manual `apt install`.
      - btop
      # ethtool: added 2026-09-15 while establishing the network throughput baseline — it's
      # what tells you whether the NIC's offloads are on (they are) and what MTU the driver
      # will accept (9500). Same rationale as btop: keep the diagnostic tracked.
      - ethtool
    state: present
    update_cache: true
    cache_valid_time: 3600

# This minimal Debian install only has C/POSIX locales — no UTF-8 at all, which breaks
# any tool that assumes it (e.g. btop refuses to start: "No UTF-8 locale detected").
# C.utf8 is glibc's built-in UTF-8 locale (available without needing locale-gen/
# /etc/locale.gen on modern glibc) — just needs to actually be selected as the default.
- name: Set default locale to C.utf8 (fixes UTF-8-dependent tools like btop)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG=C.utf8'
    create: true
    mode: '0644'

- name: Set hostname
  ansible.builtin.hostname:
    name: iomega

- name: Ensure /etc/hosts has matching hostname entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\tiomega"
