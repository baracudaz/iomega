---
# 256MB RAM, no swap = apt upgrade / heavier tasks can OOM.
- name: Check if swapfile already exists
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file_stat

- name: Create and enable swapfile
  when: not swap_file_stat.stat.exists
  block:
    - name: Allocate swapfile
      ansible.builtin.command: fallocate -l {{ swap_file_size_mb }}M {{ swap_file_path }}
      changed_when: true

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        mode: '0600'

    - name: Format swapfile
      ansible.builtin.command: mkswap {{ swap_file_path }}
      changed_when: true

    - name: Enable swapfile
      ansible.builtin.command: swapon {{ swap_file_path }}
      changed_when: true

- name: Persist swapfile in fstab
  ansible.posix.mount:
    path: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    state: present
