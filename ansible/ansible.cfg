[defaults]
inventory = inventory.ini

# Ansible's 10s default (and the 12s become-prompt wait derived from it) is too tight for
# this box: a single ~400 BogoMIPS ARMv5 core will blow past it whenever something heavy is
# running — a mdadm resync and a big rsync both did, producing spurious
# "Timeout waiting for privilege escalation prompt / UNREACHABLE" failures mid-play on
# otherwise healthy runs. Raised rather than worked around by retrying.
timeout = 60

[ssh_connection]
# Skips the sftp module-transfer round-trip per task (modules run via stdin instead) —
# a free win on this box's slow single-core ARM CPU and high per-task overhead. Requires
# `requiretty` to be unset in sudoers (confirmed true here — Debian doesn't set it by
# default, unlike RHEL/CentOS).
pipelining = True