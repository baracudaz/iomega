[defaults]
inventory = inventory.ini

[ssh_connection]
# Skips the sftp module-transfer round-trip per task (modules run via stdin instead) —
# a free win on this box's slow single-core ARM CPU and high per-task overhead. Requires
# `requiretty` to be unset in sudoers (confirmed true here — Debian doesn't set it by
# default, unlike RHEL/CentOS).
pipelining = True